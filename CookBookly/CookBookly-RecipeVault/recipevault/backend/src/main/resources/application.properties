server.port=8080

# ---- MySQL ----
# Every value below can be overridden by an environment variable of the same
# name (Spring's relaxed binding), which is how docker-compose.yml configures
# this service without touching this file - e.g. SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, APP_JWT_SECRET, APP_CORS_ALLOWED_ORIGINS.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/recipevault?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yourpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- File upload (recipe images) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${APP_UPLOAD_DIR:uploads/recipe-images}

# ---- JWT ----
app.jwt.secret=${APP_JWT_SECRET:ReplaceThisWithALongRandomBase64EncodedSecretKeyForProductionUse123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://localhost,http://localhost,capacitor://localhost}
